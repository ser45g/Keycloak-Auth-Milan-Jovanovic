services:
  keycloak.auth.api:
    image: ${DOCKER_REGISTRY-}keycloakauthapi
    container_name: api
    build:
      context: .
      dockerfile: src/Keycloak.Auth.Api/Dockerfile
    ports:
      - 5000:8080
      - 5001:8081
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard:18889"

  aspire-dashboard:
    container_name: aspire-dashboard
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13
    ports:
      - 18888:18888

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.2
    container_name: keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: true
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      #KC_HOSTNAME: localhost - because of that the asp.net core auth wasn't able to find the keys. It's better to let keycloak to define it on its own
    ports:
      - 8080:8080
      - 9000:9000

  postgres:
    container_name: postgres
    image: postgres:latest
    environment:
      POSTGRES-DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - postgres-data:/var/lib/postgresql
volumes:
  postgres-data:
    driver: local
  