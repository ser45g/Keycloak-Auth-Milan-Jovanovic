services:
  keycloak.auth.api:
    image: ${DOCKER_REGISTRY-}keycloakauthapi
    container_name: api
    build:
      context: .
      dockerfile: src/Keycloak.Auth.Api/Dockerfile
    ports:
      - 8081:8081
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard:18889"
      Authentication__TokenUrl: "http://localhost:8080/realms/auth_demo/protocol/openid-connect/token"
      Authentication__AuthorizationUrl: "http://localhost:8080/realms/auth_demo/protocol/openid-connect/auth"
      Authentication__MetadataAddress: "http://keycloak:8080/realms/auth_demo/.well-known/openid-configuration"
      Authentication__ValidIssuer: "http://localhost:8080/realms/auth_demo"
      Authentication__Audience: "public-client"

  aspire-dashboard:
    container_name: aspire-dashboard
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13
    ports:
      - 18888:18888

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.2
    container_name: keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: true
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
    ports:
      - 8080:8080
      - 9000:9000

  postgres:
    container_name: postgres
    image: postgres:19beta1
    environment:
      POSTGRES-DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - postgres-data:/var/lib/postgresql
volumes:
  postgres-data:
    driver: local
  